[package]
name = "kbswitch"
version = "0.2.0"
edition = "2024"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Globalization", "Win32_System_Com"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
